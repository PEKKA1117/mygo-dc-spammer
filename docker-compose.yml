services:
  mygo-bot:
    build: .
    image: mygo-dc-spammer
    restart: unless-stopped
    env_file: .env
    environment:
      # Paths inside the container; leave these alone.
      MYGOCHAT_PATH: /app/vendor/MyGOChat
      SETTINGS_PATH: /app/data/guilds.json
    volumes:
      # Per-guild settings survive image rebuilds.
      #
      # This is a named volume, not a host bind mount, on purpose. Docker
      # initializes an empty named volume from the image's own /app/data,
      # inheriting the uid 10001 ownership the Dockerfile sets. A bind mount
      # would instead shadow that directory with one owned by the host user,
      # which the unprivileged container user cannot write -- so guilds.json
      # would never be created and every settings change would be lost.
      #
      # To keep the file on the host where you can read it, create the
      # directory with matching ownership first:
      #     mkdir -p data && sudo chown 10001:10001 data
      # then replace the line below with:
      #     - ./data:/app/data
      - mygo-data:/app/data

volumes:
  mygo-data:
